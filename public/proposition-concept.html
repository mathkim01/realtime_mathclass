<section class="intro"><div class="eyebrow">고등학교 수학 · 명제</div><h1>명제와 조건</h1><p>참·거짓, 역과 대우, 진리집합, 충분조건과 필요조건을 문제로 정리합니다.</p><div class="guide">문제를 먼저 생각하고, 풀이의 빈칸을 클릭해 확인해 보세요. 수식은 화면에서 자동으로 조판됩니다.</div></section>

<script>const data=[
{section:'98쪽 · 명제와 역, 대우',items:[
{title:'01. 명제인 것 찾기',src:'98쪽',statement:'다음 중에서 명제인 것을 모두 찾으시오. ① √4는 무리수이다. ② 99는 큰 수이다. ③ x − 3 &lt; 0 ④ x = 1이면 x² = 1이다.',proof:['명제란 참과 거짓을 명확하게 {{판별할 수 있는}} 문장이다.','① √4 = {{2}}이며, 2는 {{유리수}}이다. ①은 {{거짓}}인 명제이다.','② ‘크다’의 기준이 {{명확하지 않으므로}} 명제가 아니다.','③ x의 값에 따라 참과 거짓이 {{달라지므로}} 명제가 아니다.','④ x = 1이면 x² = {{1}}이므로 {{참}}인 명제이다.'],answer:'{{①, ④}}'},
{title:'02. 역과 대우, 참과 거짓',src:'98쪽',statement:'다음 명제의 역과 대우를 말하고 각각의 참과 거짓을 판별하시오. (1) a = b이면 ac = bc이다. (2) x가 6의 배수이면 x는 4의 배수이다.',proof:['p ⇒ q의 역: {{q ⇒ p}}','p ⇒ q의 대우: {{¬q ⇒ ¬p}}','원래 명제와 {{대우}}의 참과 거짓은 항상 같다.','(1) 역: {{ac = bc이면 a = b이다.}} 이 명제는 {{거짓}}이다.','반례: a = 1, b = 2, c = {{0}}이면 ac = bc이지만 a ≠ b이다.','대우: {{ac ≠ bc이면 a ≠ b이다.}} 이 명제는 {{참}}이다.','(2) 원래 명제는 x = {{6}}이 반례이므로 거짓이다.','역: {{x가 4의 배수이면 x는 6의 배수이다.}} 반례 x = {{4}}이므로 {{거짓}}이다.','대우: {{x가 4의 배수가 아니면 x는 6의 배수가 아니다.}} 원래 명제와 참과 거짓이 같으므로 {{거짓}}이다.'],answer:'(1) 역 {{거짓}}, 대우 {{참}} / (2) 역 {{거짓}}, 대우 {{거짓}}'},
{title:'03. 조건의 진리집합',src:'99쪽',statement:'명제 p ⇒ q가 참일 때 항상 옳은 것을 고르시오. (P, Q는 p, q의 진리집합) ㄱ. Pᶜ ⊂ Qᶜ  ㄴ. P ∩ Q = Q  ㄷ. P ∪ Q = Q  ㄹ. Pᶜ ∩ Q = ∅',proof:['p ⇒ q가 참이면 진리집합의 관계는 {{P ⊂ Q}}이다.','여집합의 포함 관계는 {{Qᶜ ⊂ Pᶜ}}이므로 ㄱ은 일반적으로 성립하지 않는다.','P ∩ Q = {{P}}이므로 ㄴ은 일반적으로 성립하지 않는다.','P ∪ Q = {{Q}}이므로 ㄷ은 참이다.','Pᶜ ∩ Q는 {{공집합이 아닐 수 있으므로}} ㄹ은 일반적으로 성립하지 않는다.'],answer:'{{ㄷ}}'},
{title:'04. 대우로 상수 구하기',src:'99쪽',statement:'명제 ‘x² − 2x − 3 ≠ 0이면 x ≠ a이다.’가 참일 때 상수 a의 값을 모두 구하시오.',proof:['주어진 명제의 대우는 ‘{{x = a이면 x² − 2x − 3 = 0이다.}}’이다.','대우도 참이므로 x = a를 대입하면 {{a² − 2a − 3 = 0}}이다.','인수분해하면 {{(a − 3)(a + 1) = 0}}이다.','따라서 a = {{−1 또는 3}}이다.'],answer:'{{a = −1, 3}}'},
{title:'05. 필요조건과 충분조건',src:'99쪽',statement:'p가 q이기 위한 필요조건일 때 항상 옳은 것을 고르시오. ㄱ. q는 p이기 위한 충분조건이다. ㄴ. q는 p이기 위한 필요조건이다. ㄷ. ¬p는 ¬q이기 위한 충분조건이다. ㄹ. ¬q는 ¬p이기 위한 필요조건이다.',proof:['p가 q이기 위한 필요조건이라는 것은 {{q ⇒ p}}가 참이라는 뜻이다.','이 명제의 대우는 {{¬p ⇒ ¬q}}이다.','ㄱ은 {{q ⇒ p}}이므로 {{참}}이다.','ㄴ은 {{p ⇒ q}}를 요구하므로 반드시 참은 아니다.','ㄷ은 {{¬p ⇒ ¬q}}이므로 {{참}}이다.','ㄹ도 {{¬p ⇒ ¬q}}를 뜻하므로 {{참}}이다.'],answer:'{{ㄱ, ㄷ, ㄹ}}'}]},
{section:'99쪽 · 집합과 조건',items:[
{title:'07. 조건을 만족하는 집합의 순서쌍',src:'99쪽',statement:'전체집합 U = {1, 2, 3}의 공집합이 아닌 두 부분집합 A, B에 대하여 두 명제가 모두 참이다. ① 집합 A의 모든 원소 x에 대하여 x² − 3x &lt; 0이다. ② 집합 B의 어떤 원소 x에 대하여 x ∈ A이다. 가능한 순서쌍 (A, B)의 개수를 구하시오.',proof:['x² − 3x &lt; 0을 인수분해하면 {{x(x − 3) &lt; 0}}이고, 해는 {{0 &lt; x &lt; 3}}이다.','따라서 A가 될 수 있는 집합은 {{ {1}, {2}, {1, 2} }}이다.','두 번째 조건은 {{A ∩ B ≠ ∅}}을 뜻한다.','A = {1}인 경우 가능한 B는 {{4}}개이다.','A = {2}인 경우 가능한 B는 {{4}}개이다.','A = {1, 2}인 경우 가능한 B는 전체 부분집합 8개 중 ∅와 {3}을 제외한 {{6}}개이다.','따라서 순서쌍의 수는 {{4 + 4 + 6 = 14}}이다.'],answer:'{{14개}}'},
{title:'08. 필요충분조건과 구간',src:'99쪽',statement:'두 조건 p: |x − 1| &lt; 2, q: a − 1 &lt; x &lt; b + 1에 대하여 p가 q이기 위한 필요충분조건일 때 a, b를 각각 구하시오.',proof:['|x − 1| &lt; 2를 풀면 {{−2 &lt; x − 1 &lt; 2}}이다.','따라서 p의 진리집합은 {{−1 &lt; x &lt; 3}}이다.','p와 q가 필요충분조건이므로 두 진리집합이 {{같아야}} 한다.','양 끝점을 비교하면 a − 1 = {{−1}}, b + 1 = {{3}}이다.','따라서 a = {{0}}, b = {{2}}이다.'],answer:'{{a = 0, b = 2}}'},
{title:'09. 한 사람만 참말을 하는 경우',src:'99쪽',statement:'어느 동아리의 네 학생 A, B, C, D가 다음과 같이 진술했다. 네 학생 중 한 학생의 진술만 참일 때 회장은 누구인지 구하시오. A: 나는 회장이 아니에요. B: C가 회장이에요. C: D가 회장입니다. D: C의 주장은 거짓입니다.',proof:['각 회장을 가정하여 참인 진술 수를 확인한다.','회장이 A일 때 참인 진술 수는 {{1}}개이다.','회장이 B일 때 참인 진술 수는 {{2}}개이다.','회장이 C일 때 참인 진술 수는 {{3}}개이다.','회장이 D일 때 참인 진술 수는 {{2}}개이다.','참인 진술이 정확히 1개인 경우는 회장이 {{A}}일 때이다.'],answer:'{{A}}'}]},
{section:'102쪽 · 참인 명제와 역',items:[
{title:'04. 참인 명제 고르기',src:'102쪽',statement:'다음 중 참인 명제를 모두 고르시오. (x, y는 실수) ① x² = 0이면 x ≥ 0이다. ② x² = y²이면 x³ = y³이다. ③ x &lt; 0이면 |x| = −x이다. ④ xy = 0이면 x² + y² = 0이다. ⑤ x &gt; 0이고 y &lt; 0이면 x + y &lt; 0이다.',proof:['① x² = 0이면 x = {{0}}이므로 {{참}}이다.','② x = 1, y = {{−1}}이면 x² = y²이지만 x³ ≠ y³이므로 {{거짓}}이다.','③ x &lt; 0이면 절댓값의 정의에 따라 |x| = {{−x}}이므로 {{참}}이다.','④ x = 0, y = {{1}}이면 xy = 0이지만 x² + y² ≠ 0이므로 {{거짓}}이다.','⑤ x = 3, y = {{−1}}이면 x + y = 2 &gt; 0이므로 {{거짓}}이다.'],answer:'{{①, ③}}'},
{title:'05. 역과 대우가 모두 참',src:'102쪽',statement:'다음 중 역과 대우가 모두 참인 것을 있는 대로 고르시오. (a, b, c는 실수) ㄱ. ac = bc이면 a = b이다. ㄴ. ab &gt; 1이면 a &gt; 1이고 b &gt; 1이다. ㄷ. a² + b² = 0이면 a = 0이고 b = 0이다.',proof:['원래 명제와 대우의 참과 거짓은 {{항상 같다}}.','ㄱ은 c = {{0}}일 때 ac = bc이지만 a ≠ b일 수 있으므로 원래 명제가 거짓이다.','ㄴ은 a = b = {{−2}}일 때 ab = 4 &gt; 1이지만 a &gt; 1은 거짓이다.','ㄷ에서 실수의 제곱은 항상 {{0 이상}}이다. 그러므로 a² + b² = 0이면 {{a = 0, b = 0}}이다.','ㄷ의 역 ‘a = b = 0이면 a² + b² = 0이다.’도 {{참}}이다.'],answer:'{{ㄷ}}'}]},
{section:'103쪽 · 명제의 활용',items:[
{title:'09. 항상 성립하는 이차부등식',src:'103쪽',statement:'명제 ‘모든 실수 x에 대하여 x² + 4x + a ≥ 0이다.’가 참일 때, 실수 a의 최솟값을 구하시오.',proof:['완전제곱식으로 고치면 x² + 4x + a = {{(x + 2)² + a − 4}}이다.','(x + 2)²의 최솟값은 {{0}}이고 x = {{−2}}일 때 성립한다.','따라서 주어진 식의 최솟값은 {{a − 4}}이다.','모든 실수 x에서 식이 0 이상이어야 하므로 {{a − 4 ≥ 0}}이다.','따라서 a ≥ {{4}}이다.'],answer:'{{4}}'},
{title:'10. ‘또는’을 포함한 명제',src:'103쪽',statement:'전체집합 U에서 두 조건 p, q의 진리집합을 P, Q라고 하자. ‘모든 x에 대하여 p 또는 ¬q이다.’가 참일 때 P, Q의 관계로 항상 옳은 것을 고르시오. ① P = Q ② P ∪ Q = P ③ P ∩ Q = ∅ ④ P − Q = ∅ ⑤ P ∪ Q = U',proof:['‘p 또는 ¬q’는 논리식으로 {{p ∨ ¬q}}이다.','이 명제는 {{q ⇒ p}}와 동치이다.','따라서 진리집합의 포함 관계는 {{Q ⊂ P}}이다.','이에 따라 합집합은 {{P ∪ Q = P}}이다.'],answer:'{{②}}'},
{title:'11. 필요충분조건 고르기',src:'103쪽',statement:'다음 중 p가 q이기 위한 필요충분조건인 것을 모두 고르시오. (a, b는 실수) ㄱ. p: a² = 1, q: a = 1  ㄴ. p: a &gt; 0, q: a² &gt; 0  ㄷ. p: ab = 0, q: a = 0 또는 b = 0',proof:['필요충분조건이려면 {{p ⇒ q와 q ⇒ p가 모두 참}}이어야 한다.','ㄱ은 a = {{−1}}이 반례이므로 p ⇒ q가 거짓이다.','ㄴ은 a = {{−1}}이면 a² &gt; 0이지만 a &gt; 0은 성립하지 않으므로 q ⇒ p가 거짓이다.','ㄷ은 ab = 0과 ‘{{a = 0 또는 b = 0}}’이 서로 동치이다.'],answer:'{{ㄷ}}'},
{title:'13. 충분조건과 구간의 포함',src:'103쪽',statement:'두 조건 p: x² − 3ax + 2a² ≤ 0, q: −8 &lt; x ≤ 12에 대하여 p가 q이기 위한 충분조건일 때, 정수 a의 개수를 구하시오. (x는 실수)',proof:['p가 q의 충분조건이므로 {{P ⊂ Q}}가 성립해야 한다.','p를 인수분해하면 {{(x − a)(x − 2a) ≤ 0}}이다.','a ≥ 0인 경우 p의 해는 {{a ≤ x ≤ 2a}}이다.','이 구간이 −8 &lt; x ≤ 12에 포함되므로 {{a &gt; −8, 2a ≤ 12}}이다.','a ≥ 0과 합치면 {{0 ≤ a ≤ 6}}이므로 정수 a는 {{7}}개이다.','a &lt; 0인 경우 p의 해는 {{2a ≤ x ≤ a}}이다.','이 구간이 −8 &lt; x ≤ 12에 포함되므로 {{2a &gt; −8, a ≤ 12}}이다.','a &lt; 0과 합치면 {{−4 &lt; a &lt; 0}}이므로 정수 a는 {{3}}개이다.','총 개수는 {{7 + 3 = 10}}개이다.'],answer:'{{10개}}'}]}
];</script>
<script>
const meta={"title": "명제와 조건", "subtitle": "참·거짓, 역과 대우, 진리집합, 충분조건과 필요조건을 문제로 정리합니다.", "nav": ["명제와 역·대우", "집합과 조건", "참인 명제", "명제의 활용"], "badges": ["개념 확인", "집합과 비교", "반례 탐구", "종합 적용"], "intros": ["명제의 뜻을 확인하고 역·대우의 참과 거짓을 반례로 판단합니다.", "진리집합과 조건의 관계를 이용해 개수와 구간을 구합니다.", "반례를 찾거나 성질을 이용해 참인 명제를 고릅니다.", "명제의 논리를 식과 집합에 적용해 봅니다."], "summaries": ["명제는 참·거짓이 명확하며, 원래 명제와 대우의 참·거짓은 같습니다.", "p ⇒ q가 참이면 p의 진리집합은 q의 진리집합에 포함됩니다.", "거짓인 명제는 반례 하나로 판별할 수 있습니다.", "필요충분조건은 양방향의 함의가 모두 참인 경우입니다."]};
const root=document.getElementById('contents');
const nav=document.getElementById('navLinks');
let total=0;
const mathPattern=/[A-Za-z0-9√¬∅ᶜ|({−-][A-Za-z0-9√¬∅ᶜ∩∪∈⊂≥≤≠=+\-−×÷*/^²³(){}|<>∨⇒ ,]*[=<>≤≥≠∈⊂∩∪⇒∨+\-−×÷*/²³√][A-Za-z0-9√¬∅ᶜ∩∪∈⊂≥≤≠=+\-−×÷*/^²³(){}|<>∨⇒ ,]*/g;
function decode(s){const t=document.createElement('textarea');t.innerHTML=String(s);return t.value}
function toTex(s){let t=s.trim();t=t.replaceAll('{','\\{').replaceAll('}','\\}');t=t.replace(/√\(([^)]+)\)/g,'\\sqrt{$1}');t=t.replace(/√([A-Za-z0-9]+)/g,'\\sqrt{$1}').replaceAll('²','^{2}').replaceAll('³','^{3}').replaceAll('⇒','\\Rightarrow ').replaceAll('¬','\\neg ').replaceAll('∅','\\varnothing ').replaceAll('∩','\\cap ').replaceAll('∪','\\cup ').replaceAll('∈','\\in ').replaceAll('⊂','\\subseteq ').replaceAll('≥','\\ge ').replaceAll('≤','\\le ').replaceAll('≠','\\ne ').replaceAll('∨','\\lor ').replaceAll('−','-').replaceAll('ᶜ','^{c}');t=t.replace(/\(([^()]+)\)\/\(([^()]+)\)/g,'\\frac{$1}{$2}').replace(/\(([^()]+)\)\/([A-Za-z0-9]+)/g,'\\frac{$1}{$2}').replace(/([A-Za-z0-9]+)\/([A-Za-z0-9]+)/g,'\\frac{$1}{$2}');return t}
function addText(parent,raw){const s=decode(raw);mathPattern.lastIndex=0;let last=0;for(const m of s.matchAll(mathPattern)){const expr=m[0],start=m.index;if(start>last)parent.append(document.createTextNode(s.slice(last,start)));const span=document.createElement('span');span.className='math-inline';span.textContent='\\('+toTex(expr)+'\\)';parent.append(span);last=start+expr.length}if(last<s.length)parent.append(document.createTextNode(s.slice(last)))}
function addParts(parent,s){const chunks=String(s).split(/(\{\{.*?\}\})/g);for(const chunk of chunks){if(chunk.startsWith('{{')&&chunk.endsWith('}}')){total++;const b=document.createElement('button');b.type='button';b.className='blank';b.dataset.answer=decode(chunk.slice(2,-2));b.setAttribute('aria-label','정답 보기');b.setAttribute('aria-pressed','false');b.textContent='클릭';parent.append(b)}else addText(parent,chunk)}}
function make(tag,className,textValue){const e=document.createElement(tag);if(className)e.className=className;if(textValue!==undefined)e.textContent=textValue;return e}
function addStatement(parent,raw){const s=decode(raw);const starts=[...s.matchAll(/(?:^|\s+)(?:[①-⑩]|[ㄱ-ㅎ]\.|[A-D]:|\([1-9]\))/g)].map(m=>m.index+m[0].search(/\S/));if(!starts.length){addText(parent,s);return}const prompt=s.slice(0,starts[0]).trim();if(prompt){const p=make('div','question-prompt');addText(p,prompt);parent.append(p)}starts.forEach((start,i)=>{const row=make('div','question-option');addText(row,s.slice(start,starts[i+1]??s.length).trim());parent.append(row)})}
data.forEach((group,gi)=>{const section=make('section','lesson-section');section.id='section'+(gi+1);const sh=make('div','section-header');sh.append(make('h2','',group.section),make('span','badge',meta.badges[gi]||'탐구와 정리'));section.append(sh);section.append(make('p','section-intro',meta.intros[gi]||'문제를 읽고 풀이의 핵심을 확인해 봅시다.'));const link=make('a','',meta.nav[gi]||group.section);link.href='#'+section.id;nav.append(link);group.items.forEach((item,ii)=>{const card=make('article','activity');const head=make('div','activity-head');head.append(make('span','num',String(ii+1).padStart(2,'0')),make('h3','',item.title),make('span','source','교과서 '+item.src));card.append(head);const q=make('div','question-box');addStatement(q,item.statement);card.append(q);const details=make('details','dialogue-wrapper');details.open=true;details.append(make('summary','','풀이 단계 보기 · 접기'));const steps=make('ol','steps');item.proof.forEach(line=>{const li=make('li');addParts(li,line);steps.append(li)});details.append(steps);if(item.answer){const a=make('div','answer');a.append(make('span','answer-label','정답'));addParts(a,item.answer);details.append(a)}card.append(details);section.append(card)});const summary=make('div','summary-box');summary.append(make('strong','','✦ 핵심 정리'),make('p','',meta.summaries[gi]||'풀이의 핵심 원리를 설명할 수 있는지 확인해 봅시다.'));section.append(summary);const back=make('a','backtop','↑ 맨 위로');back.href='#top';section.append(back);root.append(section)});
function typeset(scope){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([scope]).catch(err=>console.error('수식 렌더링 오류',err))}
function toggle(b,show,render=true){b.classList.toggle('revealed',show);b.replaceChildren();if(show)addText(b,b.dataset.answer);else b.textContent='클릭';b.setAttribute('aria-label',show?'정답 가리기':'정답 보기');b.setAttribute('aria-pressed',show?'true':'false');if(show&&render)typeset(b)}
function update(){document.getElementById('progress').textContent=`정답 확인 ${document.querySelectorAll('.blank.revealed').length} / ${total}칸`}
root.addEventListener('click',e=>{const b=e.target.closest('.blank');if(!b)return;toggle(b,!b.classList.contains('revealed'));update()});
document.getElementById('showAll').addEventListener('click',()=>{document.querySelectorAll('.blank').forEach(b=>toggle(b,true,false));typeset(root);update()});
document.getElementById('hideAll').addEventListener('click',()=>{document.querySelectorAll('.blank').forEach(b=>toggle(b,false));update()});
document.getElementById('toggleProofs').addEventListener('click',e=>{const list=[...document.querySelectorAll('.dialogue-wrapper')];const open=list.some(d=>!d.open);list.forEach(d=>d.open=open);e.currentTarget.textContent=open?'풀이 모두 접기':'풀이 모두 보기'});
document.getElementById('printNote').addEventListener('click',()=>window.print());
update();
</script>
</body></html>
